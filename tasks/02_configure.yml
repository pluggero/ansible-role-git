---
- name: Configure git
  block:
    - name: Ensure config folder exists
      ansible.builtin.file:
        path: "{{ git_config_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Add git config file
      ansible.builtin.template:
        src: "{{ role_path }}/templates/config.j2"
        dest: "{{ git_config_file }}"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
